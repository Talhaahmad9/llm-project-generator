name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv # v10.1.0
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install root dependencies
        run: uv sync --locked --dev

      - name: Run root tests
        run: uv run pytest

      - name: Build distributions
        run: uv build --no-sources

      - name: Generate and test provider templates
        shell: bash
        run: |
          for provider in groq google; do
            ci_project_dir="${RUNNER_TEMP}/llm-project-generator-${provider}-${GITHUB_RUN_ID}"
            test ! -e "$ci_project_dir"
            uv run llm-project-generator init "$ci_project_dir" --provider "$provider"
            test -f "$ci_project_dir/.env.example"
            test -f "$ci_project_dir/.gitignore"
            test -f "$ci_project_dir/LICENSE"
            test -f "$ci_project_dir/README.md"
            test -f "$ci_project_dir/pyproject.toml"
            test -d "$ci_project_dir/src"
            test -d "$ci_project_dir/tests"
            test ! -e "$ci_project_dir/.env"
            (cd "$ci_project_dir" && uv sync --dev && uv run pytest)
          done
