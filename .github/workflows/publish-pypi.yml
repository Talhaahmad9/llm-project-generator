name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv # v10.1.0
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install root dependencies
        run: uv sync --locked --dev

      - name: Run root tests
        run: uv run pytest

      - name: Verify tag and read project version
        shell: bash
        run: |
          project_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$project_version"
          echo "PROJECT_VERSION=$project_version" >> "$GITHUB_ENV"

      - name: Build distributions
        run: uv build --no-sources

      - name: Verify distributions and smoke-test wheel
        shell: bash
        run: |
          expected_wheel="dist/llm_project_generator-${PROJECT_VERSION}-py3-none-any.whl"
          expected_sdist="dist/llm_project_generator-${PROJECT_VERSION}.tar.gz"
          test -f "$expected_wheel"
          test -f "$expected_sdist"
          shopt -s nullglob
          artifacts=(dist/*.whl dist/*.tar.gz)
          test "${#artifacts[@]}" -eq 2
          for file in "${artifacts[@]}"; do
            test "$file" = "$expected_wheel" || test "$file" = "$expected_sdist"
          done
          test ! -e dist/llm_project_generator-0.1.0-py3-none-any.whl
          test ! -e dist/llm_project_generator-0.1.0.tar.gz

          uvx --from "$expected_wheel" llm-project-generator --help
          providers=(groq google openai anthropic)
          for provider in "${providers[@]}"; do
            ci_project_dir="${RUNNER_TEMP}/llm-project-generator-${GITHUB_RUN_ID}-${provider}"
            test ! -e "$ci_project_dir"
            uvx --from "$expected_wheel" llm-project-generator init "$ci_project_dir" --provider "$provider"
            test -f "$ci_project_dir/LICENSE"
            test -f "$ci_project_dir/README.md"
            test -f "$ci_project_dir/pyproject.toml"
            test -f "$ci_project_dir/.env.example"
            test -f "$ci_project_dir/.gitignore"
            test -d "$ci_project_dir/src"
            test -d "$ci_project_dir/tests"
            test ! -e "$ci_project_dir/.env"
            (cd "$ci_project_dir" && uv sync --dev && uv run pytest)
          done

      - name: Upload distributions # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-package-distributions
          path: |
            dist/llm_project_generator-${{ env.PROJECT_VERSION }}-py3-none-any.whl
            dist/llm_project_generator-${{ env.PROJECT_VERSION }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/llm-project-generator

    steps:
      - name: Download distributions # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI # v1.14.2
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
