[project]
name = "llm-project-generator"
version = "0.1.1"
description = "Generate a tested Groq terminal chatbot project"
authors = [
    { name = "Talha Ahmad" },
]
keywords = [
    "llm",
    "groq",
    "pydantic-ai",
    "cli",
    "project-generator",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
llm-project-generator = "llm_project_generator.cli:main"

[project.urls]
Homepage = "https://github.com/Talhaahmad9/llm-project-generator"
Repository = "https://github.com/Talhaahmad9/llm-project-generator"
Issues = "https://github.com/Talhaahmad9/llm-project-generator/issues"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
