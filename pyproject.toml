[project]
name = "llm-project-generator"
version = "0.1.0"
description = "A small, installable LLM project generator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
llm-project-generator = "llm_project_generator.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
